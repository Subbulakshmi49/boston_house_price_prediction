<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston House Price Prediction</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-house-chimney-window me-2 text-info"></i>
                Boston House Price AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-brands fa-github me-1"></i>GitHub</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-circle-info me-1"></i>About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container hero-section text-center mt-5">
        <h1 class="display-4 fw-bold gradient-text">Boston House Price Prediction Using ANN</h1>
        <p class="lead text-light mb-4">AI-powered real estate valuation system</p>
        <div class="ai-icon-container mb-5">
            <i class="fa-solid fa-robot fa-3x ai-icon"></i>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card glass-card p-4 p-md-5 shadow-lg">
                    <form id="predictionForm">
                        <div class="row g-4">
                            <!-- CRIM -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="crim" step="any" required placeholder="Crime Rate">
                                    <label for="crim">CRIM (Crime Rate)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="per capita crime rate by town"><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- ZN -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="zn" step="any" required placeholder="ZN">
                                    <label for="zn">ZN (Residential Land)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="proportion of residential land zoned for lots over 25,000 sq.ft."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- INDUS -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="indus" step="any" required placeholder="INDUS">
                                    <label for="indus">INDUS (Industrial Area)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="proportion of non-retail business acres per town."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- CHAS -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <select class="form-select glass-input" id="chas" required>
                                        <option value="" selected disabled>Select...</option>
                                        <option value="1">1 - Yes</option>
                                        <option value="0">0 - No</option>
                                    </select>
                                    <label for="chas">CHAS (River Dummy)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="Charles River dummy variable (= 1 if tract bounds river; 0 otherwise)."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- NOX -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="nox" step="any" required placeholder="NOX">
                                    <label for="nox">NOX (Nitric Oxide)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="nitrogen oxides concentration (parts per 10 million)."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- RM -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="rm" step="any" required placeholder="RM">
                                    <label for="rm">RM (Average Rooms)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="average number of rooms per dwelling."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- AGE -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="age" step="any" required placeholder="AGE">
                                    <label for="age">AGE (Property Age)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="proportion of owner-occupied units built prior to 1940."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- DIS -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="dis" step="any" required placeholder="DIS">
                                    <label for="dis">DIS (Dist to Employment)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="weighted mean of distances to five Boston employment centres."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- RAD -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="rad" step="any" required placeholder="RAD">
                                    <label for="rad">RAD (Highway Access)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="index of accessibility to radial highways."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- TAX -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="tax" step="any" required placeholder="TAX">
                                    <label for="tax">TAX (Property Tax)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="full-value property-tax rate per $10,000."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- PTRATIO -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="ptratio" step="any" required placeholder="PTRATIO">
                                    <label for="ptratio">PTRATIO (Pupil/Teacher)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="pupil-teacher ratio by town."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- B -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="b" step="any" required placeholder="B">
                                    <label for="b">B (Black Population)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="1000(Bk - 0.63)^2 where Bk is the proportion of blacks by town."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                            <!-- LSTAT -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-floating position-relative">
                                    <input type="number" class="form-control glass-input" id="lstat" step="any" required placeholder="LSTAT">
                                    <label for="lstat">LSTAT (Lower Status %)</label>
                                    <div class="tooltip-icon" data-bs-toggle="tooltip" title="lower status of the population (percent)."><i class="fa-solid fa-circle-info"></i></div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-3 mt-5 justify-content-center">
                            <button type="submit" class="btn btn-predict btn-lg px-5">
                                <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Predict Price
                            </button>
                            <button type="button" id="clearBtn" class="btn btn-clear btn-lg px-5">
                                <i class="fa-solid fa-rotate-right me-2"></i> Clear
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Result Section (Hidden initially) -->
        <div class="row justify-content-center mt-5 d-none" id="resultSection">
            <div class="col-lg-8">
                <div class="card result-card text-center p-5 shadow-lg">
                    <h3 class="text-light mb-3">Predicted House Price</h3>
                    <h1 class="display-3 fw-bold text-success" id="predictedPrice">$0</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-info" style="width: 4rem; height: 4rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h4 class="text-light mt-3">Analyzing Features...</h4>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
